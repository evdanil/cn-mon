name: native

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Format, vet, and test
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then echo "$files"; exit 1; fi
          go vet ./...
          go test ./...
      - name: Race test
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...
      - name: Audit reachable vulnerabilities (Linux production packages)
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/govulncheck-bin"
          mkdir -p "$tool_dir"
          : > "$RUNNER_TEMP/govulncheck-linux.log"
          GOBIN="$tool_dir" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$tool_dir/govulncheck" -version
          set +e
          "$tool_dir/govulncheck" -scan=symbol ./cmd/... ./internal/... > "$RUNNER_TEMP/govulncheck-linux.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/govulncheck-linux.log"
          if [ "$result" -ne 0 ]; then
            python3 -c 'from pathlib import Path; import sys; p=Path(sys.argv[1]); s=p.read_text(errors="replace"); s=s[-6000:]; s=s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print("::error title=Linux govulncheck failed::" + s)' "$RUNNER_TEMP/govulncheck-linux.log"
            exit "$result"
          fi
          echo '::notice title=govulncheck::scanner=v1.8.0 target=linux/amd64 scope=./cmd/...+./internal/... scan=symbol result=pass database=https://vuln.go.dev'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cn-mon-govulncheck-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/govulncheck-linux.log
          if-no-files-found: error
          retention-days: 14
      - name: Test pinned nested pro-bing module
        run: |
          go -C third_party/pro-bing vet ./...
          go -C third_party/pro-bing test ./...
          CGO_ENABLED=1 go -C third_party/pro-bing test -race ./...
      - name: Build and smoke test
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -o dist/cn-mon ./cmd/cn-mon
          ./dist/cn-mon --help > /dev/null
          test "$(./dist/cn-mon --version)" = "cn-mon dev"
          set +e
          ./dist/cn-mon --unknown > /tmp/cn-mon-out 2>/tmp/cn-mon-err
          code=$?
          set -e
          test "$code" -eq 2
          grep -q 'unknown option' /tmp/cn-mon-err
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir"' EXIT
          set +e
          ./dist/cn-mon --list --history-file "$smoke_dir/missing.db" --log-file "$smoke_dir/cn.log" > "$smoke_dir/list.out" 2> "$smoke_dir/list.err"
          list_code=$?
          set -e
          test "$list_code" -eq 1
          test ! -s "$smoke_dir/list.out"
          test ! -e "$smoke_dir/missing.db"

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Format, vet, and test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $files = gofmt -l .
          if ($files) {
            foreach ($file in $files) {
              $message = "gofmt reports unformatted file: $file"
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error::$message"
            }
            $files
            exit 1
          }
          function Invoke-GoCheck([string]$Name, [string[]]$Arguments) {
            $output = @(& go @Arguments 2>&1)
            $code = $LASTEXITCODE
            foreach ($line in $output) { Write-Host "$line" }
            if ($code -ne 0) {
              $details = (($output | ForEach-Object { "$_" }) -join "`n")
              if (-not $details) { $details = '(no command output)' }
              $message = "go $Name failed with exit code $code`n$details"
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=go $Name failed::$message"
            }
            return $code
          }
          $failed = 0
          $vetExit = Invoke-GoCheck 'vet' @('vet', './...')
          if ($vetExit -ne 0) { $failed = $vetExit }
          $testExit = Invoke-GoCheck 'test' @('test', './...')
          if ($failed -eq 0 -and $testExit -ne 0) { $failed = $testExit }
          $nestedVetExit = Invoke-GoCheck '-C third_party/pro-bing vet' @('-C', 'third_party/pro-bing', 'vet', './...')
          if ($failed -eq 0 -and $nestedVetExit -ne 0) { $failed = $nestedVetExit }
          $nestedTestExit = Invoke-GoCheck '-C third_party/pro-bing test' @('-C', 'third_party/pro-bing', 'test', './...')
          if ($failed -eq 0 -and $nestedTestExit -ne 0) { $failed = $nestedTestExit }
          if ($failed -ne 0) { exit $failed }
      - name: Audit reachable vulnerabilities (Windows production packages)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $toolDir = Join-Path $env:RUNNER_TEMP 'govulncheck-bin'
          New-Item -ItemType Directory -Force $toolDir | Out-Null
          $log = Join-Path $env:RUNNER_TEMP 'govulncheck-windows.log'
          Set-Content -Path $log -Value '' -NoNewline
          $env:GOBIN = $toolDir
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tool = Join-Path $toolDir 'govulncheck.exe'
          & $tool -version
          & $tool -scan=symbol ./cmd/... ./internal/... *> $log
          $result = $LASTEXITCODE
          Get-Content $log
          if ($result -ne 0) {
            $details = Get-Content -Raw $log
            if ($details.Length -gt 6000) { $details = $details.Substring($details.Length - 6000) }
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows govulncheck failed::$details"
            exit $result
          }
          Write-Host '::notice title=govulncheck::scanner=v1.8.0 target=windows/amd64 scope=./cmd/...+./internal/... scan=symbol result=pass database=https://vuln.go.dev'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cn-mon-govulncheck-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\govulncheck-windows.log
          if-no-files-found: error
          retention-days: 14
      - name: Build and smoke test
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -o dist/cn-mon.exe ./cmd/cn-mon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\cn-mon.exe --help *> $null
          if ($LASTEXITCODE -ne 0) { throw 'help failed' }
          $version = & .\dist\cn-mon.exe --version
          if ($LASTEXITCODE -ne 0 -or $version -ne 'cn-mon dev') { throw 'version failed' }
          & .\dist\cn-mon.exe --unknown *> $null
          if ($LASTEXITCODE -ne 2) { throw 'invalid CLI did not exit 2' }
          $smokeDir = Join-Path $env:RUNNER_TEMP ("cn-mon-smoke-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $smokeDir | Out-Null
          try {
            $listOutput = & .\dist\cn-mon.exe --list --history-file (Join-Path $smokeDir 'missing.db') --log-file (Join-Path $smokeDir 'cn.log') 2> (Join-Path $smokeDir 'list.err')
            $listExit = $LASTEXITCODE
            if ($listExit -ne 1) { throw "default table list smoke exited $listExit, want 1" }
            if ($listOutput) { throw 'empty missing-history list produced unexpected stdout' }
            if (Test-Path (Join-Path $smokeDir 'missing.db')) { throw 'read-only list created a history database' }
          } finally {
            Remove-Item -LiteralPath $smokeDir -Recurse -Force
          }
          exit 0

  native-linux-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install disposable namespace test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 iptables util-linux
      - name: Run isolated native ICMP gate
        env:
          CNMON_NATIVE_ARTIFACT_DIR: ${{ runner.temp }}/cn-mon-native-linux
        run: scripts/test-native-linux.sh
      - name: Upload native Linux evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cn-mon-native-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cn-mon-native-linux
          if-no-files-found: error
          retention-days: 14

  native-windows-probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Run native Windows ICMP gate
        shell: pwsh
        env:
          CNMON_NATIVE_ARTIFACT_DIR: ${{ runner.temp }}\cn-mon-native-windows
        run: ./scripts/test-native-windows.ps1
      - name: Upload native Windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cn-mon-native-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\cn-mon-native-windows
          if-no-files-found: error
          retention-days: 14

  native-command-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install file-capability inspection tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcap2-bin
      - name: Run native built-command and private-process gate
        env:
          CNMON_NATIVE_COMMAND_ARTIFACT_DIR: ${{ runner.temp }}/cn-mon-native-command-linux
        run: scripts/test-native-command-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cn-mon-native-command-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cn-mon-native-command-linux
          if-no-files-found: error
          retention-days: 14

  archived-linux-command-failure-context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Retrieve bounded context from historical Linux command logs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          inspect_artifact() {
            local run_id=$1 artifact_name=$2 directory log
            directory="$RUNNER_TEMP/archived-native-command-$run_id"
            mkdir -p "$directory"
            if ! gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir "$directory" >/dev/null 2>&1; then
              echo "::notice title=Archived Linux command context::historical artifact unavailable for run $run_id"
              return 0
            fi
            log=$(find "$directory" -type f -name linux-command-native.log -print -quit)
            if [[ -z $log ]]; then
              echo "::notice title=Archived Linux command context::historical text log unavailable for run $run_id"
              return 0
            fi
            python3 - "$run_id" "$log" <<'PY'
          import re
          import sys
          from pathlib import Path

          run_id, log_path = sys.argv[1:]
          diagnostics = {}
          active_test = ""
          failures = 0

          def emit(message):
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::notice title=Archived Linux command context::{message}")

          for line in Path(log_path).read_text(errors="replace").splitlines():
              run_match = re.match(r"^=== RUN\s+(\S+)", line)
              if run_match:
                  active_test = run_match.group(1)
                  continue
              diagnostic_match = re.match(r"^\s+([^\s]+\.go:\d+:.*)$", line)
              if diagnostic_match and active_test:
                  diagnostic = diagnostic_match.group(1)
                  if not re.search(r":\s*CNMON_[A-Za-z0-9_]+(?:\s|$)", diagnostic):
                      bucket = diagnostics.setdefault(active_test, [])
                      bucket.append(diagnostic[:600])
                      del bucket[:-5]
              fail_match = re.match(r"^\s*--- FAIL:\s+(\S+)", line)
              if fail_match:
                  failed_test = fail_match.group(1)
                  context = [f"run={run_id} historical=true test={failed_test}"]
                  context.extend(f"source={diagnostic}" for diagnostic in diagnostics.get(failed_test, []))
                  context.append(line.strip()[:300])
                  emit(" | ".join(context))
                  failures += 1
                  if failures >= 5:
                      break
          if failures == 0:
              emit(f"run={run_id} archived log contained no Go test FAIL markers")
          PY
          }

          inspect_artifact 38097896970 cn-mon-native-command-linux-38097896970-1
          inspect_artifact 38096978361 cn-mon-native-command-linux-38096978361-1

  native-command-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Run native Windows command and private-console gate
        shell: pwsh
        env:
          CNMON_NATIVE_COMMAND_ARTIFACT_DIR: ${{ runner.temp }}\cn-mon-native-command-windows
        run: ./scripts/test-native-command-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cn-mon-native-command-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\cn-mon-native-command-windows
          if-no-files-found: error
          retention-days: 14

  history-python-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: evdanil/cn-tool
          ref: 2e2f3c40ef6718486f1ca4477f9145029ec495fa
          path: .reference/cn-tool
          persist-credentials: false
      - name: Run native Python and Go history interop
        env:
          CGO_ENABLED: '0'
          CNMON_HISTORY_INTEROP: '1'
          CNMON_CN_TOOL_SOURCE: ${{ github.workspace }}/.reference/cn-tool
          CNMON_PYTHON: python
        run: |
          set +e
          go test -v -timeout=8m -run '^Test(PythonSourceFixtureSemantics|NativeHistoryPythonGoInterop|NativeHistoryConcurrentPythonGoWALAndPrune|NativeHistoryKilledPythonWriterRecovers|NativeHistoryKilledGoWriterRecovers|NativeHistoryHeldGoSnapshotAcrossPythonPrune|NativeHistoryHeldPythonSnapshotAcrossGoPrune)$' ./internal/history > "$RUNNER_TEMP/history-python-interop.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/history-python-interop.log"
          if [ "$result" -ne 0 ]; then
            python3 -c 'from pathlib import Path; import sys; p=Path(sys.argv[1]); s=p.read_text(errors="replace"); s=s[-6000:]; s=s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print("::error title=history Python/Go interop failed::" + s)' "$RUNNER_TEMP/history-python-interop.log"
            exit "$result"
          fi
          grep -q -- '--- PASS: TestPythonSourceFixtureSemantics' "$RUNNER_TEMP/history-python-interop.log"
          grep -q -- '--- PASS: TestNativeHistoryPythonGoInterop' "$RUNNER_TEMP/history-python-interop.log"
          grep -q -- '--- PASS: TestNativeHistoryKilledGoWriterRecovers' "$RUNNER_TEMP/history-python-interop.log"
          grep -q -- '--- PASS: TestNativeHistoryHeldGoSnapshotAcrossPythonPrune' "$RUNNER_TEMP/history-python-interop.log"
          grep -q -- '--- PASS: TestNativeHistoryHeldPythonSnapshotAcrossGoPrune' "$RUNNER_TEMP/history-python-interop.log"
          grep -q -- 'CNMON_HISTORY_INTEROP_RESULT python-go-python=pass go-python-go=pass' "$RUNNER_TEMP/history-python-interop.log"
          grep -q -- 'CNMON_HISTORY_INTEROP_CONCURRENT python-reader=pass go-reader=pass source-writer=pass go-writer=pass prune=pass' "$RUNNER_TEMP/history-python-interop.log"
          grep -q -- 'CNMON_HISTORY_INTEROP_KILLED_WRITER recovery=pass source-status=finished' "$RUNNER_TEMP/history-python-interop.log"
          grep -q -- 'CNMON_HISTORY_INTEROP_KILLED_GO_WRITER recovery=pass committed-round=preserved partial-round=absent' "$RUNNER_TEMP/history-python-interop.log"
          grep -q -- 'CNMON_HISTORY_INTEROP_GO_SNAPSHOT held-view=stable python-commit=visible python-prune=visible next-view=updated' "$RUNNER_TEMP/history-python-interop.log"
          grep -q -- 'CNMON_HISTORY_INTEROP_PYTHON_SNAPSHOT held-view=stable go-commit=visible go-prune=visible next-view=updated' "$RUNNER_TEMP/history-python-interop.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cn-mon-history-python-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/history-python-interop.log
          if-no-files-found: error
          retention-days: 14

  history-python-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: evdanil/cn-tool
          ref: 2e2f3c40ef6718486f1ca4477f9145029ec495fa
          path: .reference/cn-tool
          persist-credentials: false
      - name: Restore pinned Python source files as LF bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          git -C .reference/cn-tool -c core.autocrlf=false -c core.eol=lf checkout-index --force -- cn_tool/utils/ping_store.py cn_tool/utils/ping_history.py
          if ($LASTEXITCODE -ne 0) { throw 'failed to restore pinned source files from their LF Git blobs' }
          $expected = @{
            'cn_tool/utils/ping_store.py' = '326ab0570dc7bf3fc43209d21d00f46f8c2b8778ea0daf4cf905c52a8c337fd4'
            'cn_tool/utils/ping_history.py' = 'd491678b240f23d26a2673951ba293eabff3a992d2840bbc1219a63ec31a89bf'
          }
          foreach ($relativePath in $expected.Keys) {
            $file = Join-Path '.reference/cn-tool' $relativePath
            $actual = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected[$relativePath]) { throw "pinned source file hash mismatch after LF checkout: $relativePath ($actual)" }
          }
          Write-Host '::notice title=cn-mon Python source checkout::pinned files restored as LF and raw SHA-256 verified'
      - name: Run native Python and Go history interop
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          CNMON_HISTORY_INTEROP: '1'
          CNMON_CN_TOOL_SOURCE: ${{ github.workspace }}/.reference/cn-tool
          CNMON_PYTHON: python
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $log = Join-Path $env:RUNNER_TEMP 'history-python-interop.log'
          go test -v -timeout=8m -run '^Test(PythonSourceFixtureSemantics|NativeHistoryPythonGoInterop|NativeHistoryConcurrentPythonGoWALAndPrune|NativeHistoryKilledPythonWriterRecovers|NativeHistoryKilledGoWriterRecovers|NativeHistoryHeldGoSnapshotAcrossPythonPrune|NativeHistoryHeldPythonSnapshotAcrossGoPrune)$' ./internal/history *> $log
          $result = $LASTEXITCODE
          Get-Content $log
          if ($result -ne 0) {
            $details = (Get-Content -Raw $log)
            if ($details.Length -gt 6000) { $details = $details.Substring($details.Length - 6000) }
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=history Python/Go interop failed::$details"
            exit $result
          }
          $text = Get-Content -Raw $log
          foreach ($marker in @('--- PASS: TestPythonSourceFixtureSemantics', '--- PASS: TestNativeHistoryPythonGoInterop', '--- PASS: TestNativeHistoryKilledGoWriterRecovers', '--- PASS: TestNativeHistoryHeldGoSnapshotAcrossPythonPrune', '--- PASS: TestNativeHistoryHeldPythonSnapshotAcrossGoPrune', 'CNMON_HISTORY_INTEROP_RESULT python-go-python=pass go-python-go=pass', 'CNMON_HISTORY_INTEROP_CONCURRENT python-reader=pass go-reader=pass source-writer=pass go-writer=pass prune=pass', 'CNMON_HISTORY_INTEROP_KILLED_WRITER recovery=pass source-status=finished', 'CNMON_HISTORY_INTEROP_KILLED_GO_WRITER recovery=pass committed-round=preserved partial-round=absent', 'CNMON_HISTORY_INTEROP_GO_SNAPSHOT held-view=stable python-commit=visible python-prune=visible next-view=updated', 'CNMON_HISTORY_INTEROP_PYTHON_SNAPSHOT held-view=stable go-commit=visible go-prune=visible next-view=updated')) {
            if (-not $text.Contains($marker)) { throw "missing required history interop marker: $marker" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cn-mon-history-python-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\history-python-interop.log
          if-no-files-found: error
          retention-days: 14
